services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3001"
      SAVE_DIR: /data
    volumes:
      - game-data:/data
    expose:
      - "3001"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN in .env to your game's domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      game:
        condition: service_healthy
volumes:
  game-data:
  caddy-data:
  caddy-config:
